<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Dashboard</title>
    <meta name="description" content="A beautiful and dynamic dashboard to track and celebrate birthdays.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-gradients">
        <div class="gradient-blob shape-1"></div>
        <div class="gradient-blob shape-2"></div>
        <div class="gradient-blob shape-3"></div>
    </div>
    
    <div class="app-container">
        <header>
            <h1>Birthday Celebrations</h1>
            <p>Tracking the special days of our amazing team</p>
        </header>

        <main>
            <section class="upcoming-section" id="upcoming-section">
                <h2>🎉 Upcoming Birthdays</h2>
                <div class="upcoming-grid" id="upcoming-grid">
                    <!-- Upcoming birthdays injected here via JS -->
                </div>
            </section>

            <section class="all-months-section">
                <h2>Calendar</h2>
                <div class="months-grid" id="months-grid">
                    <!-- Months and birthdays injected here via JS -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>Made with ❤️ using Vanilla Web Tech</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
